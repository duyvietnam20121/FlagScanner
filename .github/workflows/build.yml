# ============================================================
#  FFlag Scanner — GitHub Actions CI/CD
#  Triggers:
#    - Push lên main/master/develop
#    - Pull request vào main
#    - Tag vX.Y.Z → tự động tạo Release
#    - Manual dispatch (chọn build type)
# ============================================================
name: Build FlagScanner

on:
  push:
    branches: [ main, master, develop ]
    tags:     [ 'v*.*.*' ]          # v1.0.0, v2.1.3, ...
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options: [ Release, Debug, RelWithDebInfo ]
      upload_artifact:
        description: 'Upload build artifact'
        required: false
        default: true
        type: boolean

# Chỉ chạy một workflow mỗi branch cùng lúc, cancel run cũ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────
#  ENV chung
# ─────────────────────────────────────────────────────────────
env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
  ARTIFACT_NAME: FlagScanner-windows-x64
  EXE_PATH: build/bin

jobs:
  # ───────────────────────────────────────────────────────────
  #  JOB 1: build — Windows x64, MSVC
  # ───────────────────────────────────────────────────────────
  build:
    name: Build (${{ github.event.inputs.build_type || 'Release' }}) — Windows x64
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Cần full history để lấy tag version

      # ── 2. Lấy version string từ tag hoặc commit SHA ─────
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="dev-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      # ── 3. Cache CMake build ─────────────────────────────
      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'include/**/*.hpp') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      # ── 4. Configure CMake ───────────────────────────────
      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CONFIGURATION_TYPES=${{ env.BUILD_TYPE }}

      # ── 5. Build ─────────────────────────────────────────
      - name: Build
        shell: bash
        run: |
          cmake --build build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel $(nproc 2>/dev/null || echo 4)

      # ── 6. Verify output ─────────────────────────────────
      - name: Verify binary exists
        shell: bash
        run: |
          EXE="${{ env.EXE_PATH }}/${{ env.BUILD_TYPE }}/FlagScanner.exe"
          if [ ! -f "$EXE" ]; then
            echo "ERROR: Binary not found at $EXE"
            find build -name "*.exe" 2>/dev/null
            exit 1
          fi
          echo "Binary found: $EXE"
          ls -lh "$EXE"

      # ── 7. Smoke test: --help phải exit 0 ────────────────
      - name: Smoke test (--help)
        shell: cmd
        run: |
          build\bin\${{ env.BUILD_TYPE }}\FlagScanner.exe --help
          if %ERRORLEVEL% NEQ 0 (
            echo Smoke test failed
            exit /b 1
          )

      # ── 8. Đóng gói artifact ─────────────────────────────
      - name: Package artifact
        if: ${{ github.event.inputs.upload_artifact != 'false' }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_DIR="dist/FlagScanner-${VERSION}-windows-x64"
          mkdir -p "$PKG_DIR"

          # Exe
          cp "${{ env.EXE_PATH }}/${{ env.BUILD_TYPE }}/FlagScanner.exe" "$PKG_DIR/"

          # Header files (cho người dùng integrate vào project riêng)
          cp -r include/                     "$PKG_DIR/include/"

          # Docs
          cp README.md                       "$PKG_DIR/"
          cp CMakeLists.txt                  "$PKG_DIR/"

          # Version file
          echo "Version: ${VERSION}"                         > "$PKG_DIR/VERSION.txt"
          echo "Build:   ${{ env.BUILD_TYPE }}"             >> "$PKG_DIR/VERSION.txt"
          echo "Commit:  ${{ github.sha }}"                 >> "$PKG_DIR/VERSION.txt"
          echo "Date:    $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$PKG_DIR/VERSION.txt"

          # Zip
          cd dist
          7z a "../${{ env.ARTIFACT_NAME }}-${VERSION}.zip" "FlagScanner-${VERSION}-windows-x64/"
          cd ..
          ls -lh "${{ env.ARTIFACT_NAME }}-${VERSION}.zip"
          echo "pkg_zip=${{ env.ARTIFACT_NAME }}-${VERSION}.zip" >> "$GITHUB_ENV"

      # ── 9. Upload artifact (mọi build) ───────────────────
      - name: Upload build artifact
        if: ${{ github.event.inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ steps.version.outputs.version }}
          path: ${{ env.pkg_zip }}
          retention-days: 30
          if-no-files-found: error

      # ── 10. Build summary ────────────────────────────────
      - name: Write build summary
        if: always()
        shell: bash
        run: |
          echo "## FlagScanner Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo ""                              >> "$GITHUB_STEP_SUMMARY"
          echo "| Key | Value |"              >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|-------|"              >> "$GITHUB_STEP_SUMMARY"
          echo "| Version     | \`${{ steps.version.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build type  | \`${{ env.BUILD_TYPE }}\`  |"               >> "$GITHUB_STEP_SUMMARY"
          echo "| Runner      | \`${{ runner.os }} ${{ runner.arch }}\` |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit      | \`${{ github.sha }}\`      |"               >> "$GITHUB_STEP_SUMMARY"
          echo "| Triggered   | \`${{ github.event_name }}\` |"             >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────
  #  JOB 2: release — chỉ chạy khi push tag vX.Y.Z
  # ───────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    # Cần quyền tạo release
    permissions:
      contents: write

    steps:
      # ── 1. Lấy version từ tag ────────────────────────────
      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # ── 2. Download artifact từ job build ────────────────
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}-${{ steps.version.outputs.version }}
          path: dist/

      # ── 3. Tạo GitHub Release với changelog ──────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "FlagScanner ${{ steps.version.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true   # Tự generate notes từ commits
          body: |
            ## FlagScanner ${{ steps.version.outputs.version }}

            ### Download
            Tải file `.zip` bên dưới, giải nén và chạy:
            ```
            FlagScanner.exe --help
            FlagScanner.exe --verbose --outdir ./output
            ```

            ### Requirements
            - Windows 10/11 x64
            - Run as Administrator (cần quyền đọc process memory)

            ### Build info
            - Compiler: MSVC (Visual Studio 2022)
            - Standard: C++20
            - Config: Release + /O2

          files: dist/*.zip

  # ───────────────────────────────────────────────────────────
  #  JOB 3: lint — kiểm tra code style (mọi PR)
  # ───────────────────────────────────────────────────────────
  lint:
    name: Lint (clang-format check)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format-17

      - name: Check formatting
        run: |
          # Kiểm tra tất cả .hpp và .cpp
          FILES=$(find . -name "*.hpp" -o -name "*.cpp" | grep -v build/)
          FAIL=0
          for f in $FILES; do
            if ! clang-format-17 --dry-run --Werror "$f" 2>/dev/null; then
              echo "  Needs formatting: $f"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo ""
            echo "Run: clang-format -i \$(find . -name '*.hpp' -o -name '*.cpp')"
            exit 1
          fi
          echo "All files formatted correctly."