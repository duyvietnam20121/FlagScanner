# ============================================================
#  FFlag Scanner — GitHub Actions CI/CD
#  Triggers:
#    - Push lên main/master/develop
#    - Pull request vào main
#    - Tag vX.Y.Z → tự động tạo Release
#    - Manual dispatch (chọn build type)
# ============================================================
name: Build FlagScanner

on:
  push:
    branches: [ main, master, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build configuration'
        required: true
        default: 'Release'
        type: choice
        options: [ Release, Debug, RelWithDebInfo ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}

jobs:
  # ───────────────────────────────────────────────────────────
  #  JOB 1: build
  # ───────────────────────────────────────────────────────────
  build:
    name: "🔨 Build (${{ github.event.inputs.build_type || 'Release' }}) · Windows x64"
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Version ───────────────────────────────────────
      - name: "🏷️  Determine version"
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="dev-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Console banner
          echo ""
          echo "┌─────────────────────────────────────────┐"
          echo "│  FFlag Scanner  ·  CI Build             │"
          echo "│  Version  : ${VERSION}"
          echo "│  Config   : ${{ env.BUILD_TYPE }}"
          echo "│  Commit   : ${GITHUB_SHA::8}"
          echo "└─────────────────────────────────────────┘"
          echo ""

      # ── 3. Cache ─────────────────────────────────────────
      - name: "♻️  Cache CMake build"
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'include/**/*.hpp') }}
          restore-keys: cmake-${{ runner.os }}-

      # ── 4. Configure ─────────────────────────────────────
      - name: "⚙️  Configure CMake"
        shell: bash
        run: |
          echo "::group::CMake configure output"
          cmake -B build \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_CONFIGURATION_TYPES=${{ env.BUILD_TYPE }}
          echo "::endgroup::"

      # ── 5. Build ─────────────────────────────────────────
      - name: "🏗️  Build"
        shell: bash
        run: |
          echo "::group::MSBuild output"
          cmake --build build \
            --config ${{ env.BUILD_TYPE }} \
            --parallel 4 \
            -- /nologo /consoleloggerparameters:Summary
          echo "::endgroup::"

      # ── 6. Verify ────────────────────────────────────────
      - name: "✅ Verify binary"
        shell: bash
        run: |
          EXE="build/bin/${{ env.BUILD_TYPE }}/FlagScanner.exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::Binary not found at $EXE"
            echo "Files found:"
            find build -name "*.exe" 2>/dev/null || echo "  (none)"
            exit 1
          fi
          SIZE=$(du -h "$EXE" | cut -f1)
          echo "::notice::Binary OK · ${SIZE} · ${EXE}"

      # ── 7. Smoke test ────────────────────────────────────
      - name: "🚬 Smoke test (--help)"
        shell: cmd
        run: |
          echo.
          echo === Smoke test: --help ===
          build\bin\${{ env.BUILD_TYPE }}\FlagScanner.exe --help
          if %ERRORLEVEL% NEQ 0 (
            echo ::error::Smoke test failed with exit code %ERRORLEVEL%
            exit /b 1
          )
          echo === Smoke test PASSED ===

      # ── 8. Upload artifact (exe + headers, không zip) ────
      - name: "📤 Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: FlagScanner-${{ steps.version.outputs.version }}-windows-x64
          # Upload thẳng folder, GitHub tự nén khi download
          path: |
            build/bin/${{ env.BUILD_TYPE }}/FlagScanner.exe
            include/
            README.md
            CMakeLists.txt
          retention-days: 30
          if-no-files-found: error

      # ── 9. Build summary ─────────────────────────────────
      - name: "📋 Build summary"
        if: always()
        shell: bash
        run: |
          STATUS="${{ job.status }}"
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## ${ICON} FlagScanner Build — ${{ steps.version.outputs.version }}

          | | |
          |---|---|
          | **Status**    | ${STATUS} |
          | **Version**   | \`${{ steps.version.outputs.version }}\` |
          | **Config**    | \`${{ env.BUILD_TYPE }}\` |
          | **Runner**    | \`${{ runner.os }} · ${{ runner.arch }}\` |
          | **Commit**    | \`${{ github.sha }}\` |
          | **Trigger**   | \`${{ github.event_name }}\` |
          EOF

  # ───────────────────────────────────────────────────────────
  #  JOB 2: release — chỉ chạy khi push tag vX.Y.Z
  # ───────────────────────────────────────────────────────────
  release:
    name: "🚀 GitHub Release"
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: "🏷️  Get version"
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          IS_PRE=$( [[ "$VERSION" == *"-"* ]] && echo true || echo false )
          echo "prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"

      - name: "📥 Download artifact"
        uses: actions/download-artifact@v4
        with:
          name: FlagScanner-${{ steps.version.outputs.version }}-windows-x64
          path: release-files/

      - name: "🚀 Create Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "FlagScanner ${{ steps.version.outputs.version }}"
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## FlagScanner ${{ steps.version.outputs.version }}

            ### Cài đặt
            1. Tải file từ **Assets** bên dưới
            2. Giải nén, chạy với quyền Administrator:
            ```
            FlagScanner.exe --help
            FlagScanner.exe --verbose --outdir ./output
            ```

            ### Yêu cầu
            - Windows 10/11 x64
            - Administrator (cần đọc process memory)

            ### Build info
            - Compiler : MSVC 2022 · C++20
            - Config   : Release · /O2 · /W4 /WX
          files: release-files/**

  # ───────────────────────────────────────────────────────────
  #  JOB 3: lint — kiểm tra clang-format trên PR
  # ───────────────────────────────────────────────────────────
  lint:
    name: "🧹 clang-format check"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🔧 Install clang-format"
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang-format-17

      - name: "🧹 Check formatting"
        run: |
          FILES=$(find . -path ./build -prune -o \( -name "*.hpp" -o -name "*.cpp" \) -print)
          FAIL=0
          for f in $FILES; do
            if ! clang-format-17 --dry-run --Werror "$f" 2>/dev/null; then
              echo "::warning file=${f}::Needs clang-format"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then
            echo "::error::Some files need formatting. Run:"
            echo "  clang-format -i \$(find . -name '*.hpp' -o -name '*.cpp')"
            exit 1
          fi
          echo "All files formatted correctly ✅"